[project]
name = "dna-factory"
version = "2.4.0"
description = "LLM Post-Training Platform by Dnotitia Inc."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate==1.15.0",
    "apache-tvm-ffi==0.1.11",
    "datasets==5.1.0",
    "deepspeed==0.19.7",
    "inspect-ai==0.3.277",
    "inspect-evals==0.23.0",
    "kernels==0.17.2",
    "liger-kernel==0.8.4",
    "math-verify==0.9.0",
    "peft==0.21.2",
    "pytest==9.1.1",
    "requests==2.34.2",
    "ruff==0.16.10",
    "tilelang==0.1.12",
    "torch==2.13.0",
    "transformers==5.19.0",
    "trl==1.15.0",
    "vllm==0.30.0",
    "wandb==0.30.0",
]

[tool.uv]
package = false

[tool.ruff]
# Pin the target version rather than inferring it from requires-python.
target-version = "py314"

