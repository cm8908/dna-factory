model_name_or_path: dnotitia/Qwen3-0.6B

run_name: qwen3-0.6B-grpo-unsloth

# Load the model through unsloth's FastModel (single GPU only; `uv sync --extra unsloth`). See docs/unsloth.md.
# With `use_vllm: true` (the default) unsloth owns the colocated vLLM engine and shares the LoRA weights with it;
# `vllm_gpu_memory_utilization` sizes that engine. unsloth's engine is LoRA-only: full fine-tuning falls back
# to HF generate.
use_unsloth: true

use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0  # unsloth's fast LoRA path needs 0 (TRL's default is 0.05)
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
learning_rate: 1e-5  # LoRA typically uses a higher learning rate than full fine-tuning

num_generations: 8
per_device_train_batch_size: 8

# Educational only (same as qwen3-0.6B-grpo.yaml): too short for math, completions get truncated
max_completion_length: 4096
vllm_max_model_length: 8192
