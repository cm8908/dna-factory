model_name_or_path: dnotitia/Qwen3-0.6B-Base
dataset_name: trl-lib/Capybara

run_name: quickstart-unsloth

# Load the model through unsloth's FastModel (single GPU only; `uv sync --extra unsloth`). See docs/unsloth.md.
use_unsloth: true

# unsloth is used with LoRA (or QLoRA via `load_in_4bit: true`) in this example; full fine-tuning also works
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0  # unsloth's fast LoRA path needs 0 (TRL's default is 0.05)
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
learning_rate: 2e-4  # LoRA typically uses a higher learning rate than full fine-tuning

max_length: 2048
packing: true

assistant_only_loss: true
num_train_epochs: 1

per_device_train_batch_size: 2
debug_first_n_batches: 2
