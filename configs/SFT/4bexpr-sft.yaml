model_name_or_path: dnotitia/Qwen3-4B-Base-NoThink

run_name: sft

max_length: 32000
packing: true

assistant_only_loss: true
num_train_epochs: 6

gradient_accumulation_steps: 8
per_device_train_batch_size: 2

report_to:
  - wandb

periodic_save_seconds: 80m
eval_on_checkpoint: true

datasets:
  - path: dnotitia/magpie-qwen3-4b-instruct-2507
    name: all
    split: train
    columns:
      - messages
  - path: dnotitia/magpie-glm5.1
    name: all
    split: train
    columns:
      - messages
